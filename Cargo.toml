[workspace]
members = ["crates/hx-econ"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
